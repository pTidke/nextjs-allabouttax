[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfanchor"
version = "0.0.1"
description = "Turn any PDF into LLM-readable, RAG-ready text with every line anchored to its source and a rule-based trust verdict."
readme = "README.md"
requires-python = ">=3.12"
# A licence has not been chosen yet. Do not publish until one is added.
dependencies = [
  "pdfplumber>=0.11,<0.12",
  "pypdf>=6,<7",
  "pydantic>=2.9,<3",
  "Pillow>=11",
]

[project.optional-dependencies]
easyocr = ["easyocr>=1.7,<2", "numpy"]
test = ["pytest>=8", "reportlab>=4", "ruff>=0.6"]

[project.scripts]
pdfanchor = "pdfanchor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
