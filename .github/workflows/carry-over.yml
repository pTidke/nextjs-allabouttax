name: Carry over staging review work
# R3. Manual only.
#   inspect  reads the staging review database and the live library and prints
#            counts, hash matches and how staging's regions line up with the
#            engine's lines. Changes nothing.
#   plan     prints what apply would write. Changes nothing.
#   apply    writes it: line decisions, an accepted text check where staging
#            accepted the extraction, tax-review drafts and the history. Safe to
#            run again. Type "apply" to confirm.
# The staging database is only ever read. The log is public, so it prints no
# document text, reviewer identities or notes.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        type: choice
        options:
          - inspect
          - plan
          - apply
        default: inspect
      confirm:
        description: 'For apply only: type "apply" to change the live review records'
        required: false
permissions:
  contents: read
concurrency:
  group: staging-carry-over
  cancel-in-progress: false
jobs:
  carry-over:
    if: github.ref == 'refs/heads/main' && (inputs.mode != 'apply' || inputs.confirm == 'apply')
    runs-on: ubuntu-latest
    environment: tax-worker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --legacy-peer-deps
      - name: ${{ inputs.mode }}
        run: npx tsx scripts/staging-carry-over.ts "$MODE"
        env:
          MODE: ${{ inputs.mode }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
