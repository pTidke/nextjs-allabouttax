name: Extract pending documents
# Runs the pdfanchor engine over pending PDFs and stores each result for review.
# It only adds ExtractionRun rows; it never approves or publishes anything.
on:
  schedule:
    - cron: "47 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extract-documents
  cancel-in-progress: false
jobs:
  extract:
    if: vars.TAX_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: tax-worker
    # 20 minutes of budget, plus up to 15 for a long scan started just before it ran
    # out (scanned pages take about 20 seconds each with the second reader).
    timeout-minutes: 40
    env:
      # The engine release this app is tested with. Update both together.
      PDFANCHOR_REF: 4afb7701e0defa80e1bc1917a8379361601a3920
      # The second reader's models (EasyOCR, English), cached between runs.
      EASYOCR_MODELS: /home/runner/easyocr-models
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --legacy-peer-deps
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the engine, Tesseract (English and Hindi) and EasyOCR
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-hin
          # CPU-only PyTorch for EasyOCR, the second reader on scanned pages.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "pdfanchor[easyocr] @ git+https://github.com/pTidke/pdfanchor@${PDFANCHOR_REF}"
      - uses: actions/cache@v4
        with:
          path: /home/runner/easyocr-models
          key: easyocr-models-en-v1
      - name: Check the readers (fetches EasyOCR's models on the first run)
        run: |
          mkdir -p "$EASYOCR_MODELS"
          pdfanchor engines --easyocr-models "$EASYOCR_MODELS" --easyocr-download
      - name: Extract
        run: npm run tax:extract
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXTRACT_MAX: "60"
          EXTRACT_BUDGET_MINUTES: "20"
